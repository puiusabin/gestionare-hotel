services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: hotel_reservation
      MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  web:
    build: .
    ports:
      - "8080:80"
    environment:
      # Database connection (matches 'db' service name)
      MYSQLHOST: db
      MYSQLDATABASE: hotel_reservation
      MYSQLUSER: root
      MYSQLPASSWORD: ""
      MYSQLPORT: 3306
      # Add your actual keys here or in .env
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-your_key}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
    volumes:
      - .:/var/www/html
    depends_on:
      - db

volumes:
  db_data:
