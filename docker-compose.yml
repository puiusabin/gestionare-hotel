services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: hotel_reservation
      MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  web:
    build: .
    ports:
      - "8080:80"
    environment:
      MYSQLHOST: db
      MYSQLDATABASE: hotel_reservation
      MYSQLUSER: root
      MYSQLPASSWORD: ""
      MYSQLPORT: 3306
      APP_ENV: local
    volumes:
      - .:/app
    depends_on:
      - db

volumes:
  db_data:
